<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triggle</title>
    <style>
        body { overflow: hidden; margin: 0; }
        #canvas { display: block; height: 100vh; width: 100vw; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script type="text/javascript">
        let gameModule = null;
        let gameExports = null;

        var Module = {
            canvas: document.getElementById('canvas'),
            preRun: [function() {
                Module.addRunDependency('game-wasm');

                fetch('game/game.wasm')
                    .then(r => r.arrayBuffer())
                    .then(bytes => WebAssembly.compile(bytes))
                    .then(mod => {
                        gameModule = mod;
                        const engineMemory = Module.wasmMemory;

                        const imports = {
                            env: {
                                // Core
                                engine_init:             Module._engine_init,
                                engine_cleanup:          Module._engine_cleanup,
                                engine_malloc:           Module._engine_malloc,
                                engine_free:             Module._engine_free,
                                // Mesh
                                engine_mesh_create:      Module._engine_mesh_create,
                                engine_mesh_destroy:     Module._engine_mesh_destroy,
                                // Shader + Pipeline
                                engine_shader_create:    Module._engine_shader_create,
                                engine_pipeline_create:  Module._engine_pipeline_create,
                                // Image + Sampler
                                engine_image_create_target: Module._engine_image_create_target,
                                engine_sampler_create:   Module._engine_sampler_create,
                                // Pass
                                engine_pass_create:      Module._engine_pass_create,
                                engine_pass_begin:       Module._engine_pass_begin,
                                engine_pass_begin_default: Module._engine_pass_begin_default,
                                engine_pass_end:         Module._engine_pass_end,
                                engine_commit:           Module._engine_commit,
                                // Draw
                                engine_apply_pipeline:   Module._engine_apply_pipeline,
                                engine_bind_mesh:        Module._engine_bind_mesh,
                                engine_bind_image:       Module._engine_bind_image,
                                engine_apply_uniforms:   Module._engine_apply_uniforms,
                                engine_draw_elements:    Module._engine_draw_elements,
                                // Memory bridge
                                bulk_copy: (dst, src, len) => {
                                    new Uint8Array(engineMemory.buffer, dst, len)
                                        .set(new Uint8Array(gameExports.memory.buffer, src, len));
                                },
                            },
                            wasi_snapshot_preview1: {
                                fd_write: (fd, iovs_ptr, iovs_len, nwritten_ptr) => {
                                    const mem = new DataView(gameExports.memory.buffer);
                                    let written = 0;
                                    for (let i = 0; i < iovs_len; i++) {
                                        const ptr = mem.getUint32(iovs_ptr + i * 8, true);
                                        const len = mem.getUint32(iovs_ptr + i * 8 + 4, true);
                                        const bytes = new Uint8Array(gameExports.memory.buffer, ptr, len);
                                        const text = new TextDecoder().decode(bytes);
                                        if (fd === 1) console.log(text);
                                        else console.error(text);
                                        written += len;
                                    }
                                    mem.setUint32(nwritten_ptr, written, true);
                                    return 0;
                                },
                                fd_read: () => 8,
                                fd_close: () => 0,
                                fd_fdstat_get: (fd, buf) => {
                                    const mem = new DataView(gameExports.memory.buffer);
                                    mem.setUint8(buf, 4);
                                    mem.setUint16(buf + 2, 0, true);
                                    mem.setBigUint64(buf + 8, 0n, true);
                                    mem.setBigUint64(buf + 16, 0n, true);
                                    return 0;
                                },
                                fd_fdstat_set_flags: () => 0,
                                fd_seek: () => 8,
                                fd_prestat_get: () => 8,
                                fd_prestat_dir_name: () => 8,
                                path_open: () => 44,
                                clock_time_get: (id, precision, time_ptr) => {
                                    const now = BigInt(Date.now()) * 1000000n;
                                    const mem = new DataView(gameExports.memory.buffer);
                                    mem.setBigInt64(time_ptr, now, true);
                                    return 0;
                                },
                                proc_exit: (code) => { throw new Error('proc_exit: ' + code); },
                                environ_get: () => 0,
                                environ_sizes_get: (count_ptr, buf_size_ptr) => {
                                    const mem = new DataView(gameExports.memory.buffer);
                                    mem.setUint32(count_ptr, 0, true);
                                    mem.setUint32(buf_size_ptr, 0, true);
                                    return 0;
                                },
                                args_get: () => 0,
                                args_sizes_get: (argc_ptr, argv_buf_size_ptr) => {
                                    const mem = new DataView(gameExports.memory.buffer);
                                    mem.setUint32(argc_ptr, 0, true);
                                    mem.setUint32(argv_buf_size_ptr, 0, true);
                                    return 0;
                                },
                                random_get: (buf, buf_len) => {
                                    const bytes = new Uint8Array(gameExports.memory.buffer, buf, buf_len);
                                    crypto.getRandomValues(bytes);
                                    return 0;
                                },
                                sched_yield: () => 0,
                                poll_oneoff: () => 0,
                            },
                        };

                        const instance = new WebAssembly.Instance(gameModule, imports);
                        gameExports = instance.exports;
                        if (gameExports._initialize) gameExports._initialize();
                        Module._gameExports = gameExports;
                        Module.removeRunDependency('game-wasm');
                    })
                    .catch(err => console.error('Failed to load game.wasm:', err));
            }],
        };
    </script>
    <script async src="triggle.js"></script>
</body>
</html>
