<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triggle</title>
    <style>
        body { overflow: hidden; margin: 0; }
        #canvas { display: block; height: 100vh; width: 100vw; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script type="text/javascript">
        let gameExports = null;
        const utf8Dec = new TextDecoder();
        const utf8Enc = new TextEncoder();

        // Minimal WASI polyfill for Go wasip1 reactor
        function wasiPolyfill() {
            const mem = () => new DataView(gameExports.memory.buffer);
            return {
                fd_write: (fd, iovs_ptr, iovs_len, nwritten_ptr) => {
                    const m = mem();
                    let written = 0;
                    for (let i = 0; i < iovs_len; i++) {
                        const ptr = m.getUint32(iovs_ptr + i * 8, true);
                        const len = m.getUint32(iovs_ptr + i * 8 + 4, true);
                        const text = utf8Dec.decode(new Uint8Array(gameExports.memory.buffer, ptr, len));
                        if (fd === 1) console.log(text); else console.error(text);
                        written += len;
                    }
                    m.setUint32(nwritten_ptr, written, true);
                    return 0;
                },
                clock_time_get: (id, precision, ptr) => {
                    mem().setBigInt64(ptr, BigInt(Date.now()) * 1000000n, true);
                    return 0;
                },
                random_get: (buf, len) => {
                    crypto.getRandomValues(new Uint8Array(gameExports.memory.buffer, buf, len));
                    return 0;
                },
                environ_sizes_get: (count, size) => { const m = mem(); m.setUint32(count, 0, true); m.setUint32(size, 0, true); return 0; },
                args_sizes_get: (argc, argv) => { const m = mem(); m.setUint32(argc, 0, true); m.setUint32(argv, 0, true); return 0; },
                fd_fdstat_get: (fd, buf) => {
                    const m = mem();
                    m.setUint8(buf, 4);
                    m.setUint16(buf + 2, 0, true);
                    m.setBigUint64(buf + 8, 0n, true);
                    m.setBigUint64(buf + 16, 0n, true);
                    return 0;
                },
                proc_exit: (code) => { throw new Error('proc_exit: ' + code); },
                // Stubs — imported by Go but not called in reactor mode
                fd_read: () => 8, fd_close: () => 0, fd_fdstat_set_flags: () => 0,
                fd_seek: () => 8, fd_prestat_get: () => 8, fd_prestat_dir_name: () => 8,
                path_open: () => 44, environ_get: () => 0, args_get: () => 0,
                sched_yield: () => 0, poll_oneoff: () => 0,
            };
        }

        var Module = {
            canvas: document.getElementById('canvas'),
            preRun: [function() {
                Module.addRunDependency('game-wasm');

                fetch('game/game.wasm')
                    .then(r => r.arrayBuffer())
                    .then(bytes => WebAssembly.compile(bytes))
                    .then(mod => {
                        const backendMemory = Module.wasmMemory;

                        const utf8FromGame = (ptr, len) => {
                            if (!gameExports || len <= 0 || ptr === 0) return '';
                            return utf8Dec.decode(new Uint8Array(gameExports.memory.buffer, ptr, len));
                        };
                        let nextTextFont = 1;
                        const textFonts = new Map();
                        const textCanvas = document.createElement('canvas');
                        const textCtx = textCanvas.getContext('2d', { willReadFrequently: true });
                        const gameMem = () => new DataView(gameExports.memory.buffer);
                        const cssFontFor = (state) => `${state.fontPx}px ${state.fontCSS}`;
                        const setTextFont = (state) => {
                            textCtx.font = cssFontFor(state);
                            textCtx.fillStyle = '#ffffff';
                            textCtx.textBaseline = 'alphabetic';
                        };
                        // Pixi's METRICS_STRING + BASELINE_SYMBOL: '|' (vertical bar),
                        // 'É' (cap + accent), 'q' (descender), 'Å' (cap + ring), 'M' (cap
                        // baseline). Single semantic — actualBoundingBoxAscent/Descent of
                        // this fixed probe — works across every browser we ship to. Pixi
                        // and several other engines use exactly this; see
                        // ai/text-review.md "Part 1" for the comparison.
                        const METRICS_PROBE = '|ÉqÅM';
                        // Cache by CSS `font` shorthand (size + family). Fonts are reloaded
                        // sometimes; metrics are font-face properties, not request-scoped.
                        const fontMetricsCache = new Map();
                        const measureFontMetrics = (state) => {
                            const cssFont = cssFontFor(state);
                            const cached = fontMetricsCache.get(cssFont);
                            if (cached) return cached;
                            setTextFont(state);
                            const m = textCtx.measureText(METRICS_PROBE);
                            // actualBoundingBox* is universally supported on our targets;
                            // fontBoundingBox* differs across browsers (Safari quirks). Pin
                            // to the single semantic to keep heights stable everywhere.
                            const ascent = Math.max(1, Math.ceil(m.actualBoundingBoxAscent || 0));
                            const descent = Math.max(0, Math.ceil(m.actualBoundingBoxDescent || 0));
                            // Pixi-style: lineSkip = ascent + descent (no leading
                            // multiplier). Widgets add breathing room via padding so it's
                            // tunable without re-probing the font. The previous *1.15
                            // double-counted leading in fonts that already encode it.
                            const lineSkip = Math.max(1, ascent + descent);
                            const result = { height: lineSkip, ascent, descent, lineSkip };
                            fontMetricsCache.set(cssFont, result);
                            return result;
                        };
                        const measureRunLayout = (state, s) => {
                            setTextFont(state);
                            const m = textCtx.measureText(s);
                            const advance = Math.max(0, Math.ceil(m.width || 0));
                            const left = Math.max(0, Math.ceil(m.actualBoundingBoxLeft || 0));
                            const rawRight = Math.max(0, Math.ceil(m.actualBoundingBoxRight || 0));
                            const right = Math.max(advance, rawRight);
                            // Use font metrics (stable across content), not actualBoundingBox
                            // — otherwise height jumps when ascenders/descenders enter the string.
                            const ascent = state.metrics.ascent;
                            const descent = state.metrics.descent;
                            const width = Math.min(2048, Math.max(advance, left + right));
                            const height = Math.min(2048, Math.max(1, ascent + descent));
                            return { left, ascent, width, height, stride: width * 4 };
                        };

                        // Text-input overlay (hidden <input>). Lazy-created on first focus.
                        // pointer-events:none lets all pointer input reach the canvas; sokol
                        // (with html5_bubble_key_events=true) delivers Enter/Escape/etc. as
                        // G_EVENT_KEY_DOWN. The input is focused programmatically; keyboard
                        // input routes into it natively (IME, bidi, clipboard all free).
                        let textInputEl = null;
                        const ensureTextInputEl = () => {
                            if (textInputEl) return textInputEl;
                            const el = document.createElement('input');
                            el.type = 'text';
                            el.setAttribute('autocomplete', 'off');
                            el.setAttribute('autocorrect', 'off');
                            el.setAttribute('autocapitalize', 'off');
                            el.setAttribute('spellcheck', 'false');
                            const s = el.style;
                            s.position = 'absolute';
                            s.opacity = '0.01';
                            s.caretColor = 'transparent';
                            s.color = 'transparent';
                            s.background = 'transparent';
                            s.border = 'none';
                            s.outline = 'none';
                            s.padding = '0';
                            s.margin = '0';
                            s.left = '-1000px';
                            s.top = '-1000px';
                            s.width = '10px';
                            s.height = '10px';
                            s.zIndex = '10';
                            s.pointerEvents = 'none';
                            // Tab must not move focus away from our overlay.
                            el.addEventListener('keydown', (e) => {
                                if (e.key === 'Tab') e.preventDefault();
                            });
                            document.body.appendChild(el);
                            textInputEl = el;
                            return el;
                        };
                        const utf8LenStr = (s) => (s ? utf8Enc.encode(s).length : 0);

                        // Auto-forward all backend_* exports to game imports
                        const env = {
                            backend_log_error: (msgPtr, msgLen) => {
                                console.error(utf8FromGame(msgPtr, msgLen));
                            },
                            backend_log_warning: (msgPtr, msgLen) => {
                                console.warn(utf8FromGame(msgPtr, msgLen));
                            },
                            backend_text_font_open: (_e, pathPtr, pathLen, ptSize) => {
                                const handle = nextTextFont++;
                                const state = {
                                    fontPx: Math.max(8, Math.round(ptSize)),
                                    fontCSS: (pathLen > 0 && pathPtr !== 0) ? utf8FromGame(pathPtr, pathLen) : 'monospace,sans-serif',
                                };
                                state.metrics = measureFontMetrics(state);
                                textFonts.set(handle, state);
                                return handle;
                            },
                            backend_text_font_close: (_e, font) => {
                                textFonts.delete(font);
                            },
                            backend_text_font_get_metrics: (_e, font, outPtr) => {
                                const state = textFonts.get(font);
                                if (!state || outPtr === 0) return -1;
                                const mem = gameMem();
                                mem.setInt32(outPtr + 0, state.metrics.height, true);
                                mem.setInt32(outPtr + 4, state.metrics.ascent, true);
                                mem.setInt32(outPtr + 8, state.metrics.descent, true);
                                mem.setInt32(outPtr + 12, state.metrics.lineSkip, true);
                                return 0;
                            },
                            backend_text_measure_utf8: (_e, font, textPtr, textLen, outPtr) => {
                                const state = textFonts.get(font);
                                if (!state || outPtr === 0) return -1;
                                const mem = gameMem();
                                const utf8 = textLen > 0 ? utf8FromGame(textPtr, textLen) : '';
                                const s = utf8.normalize('NFC');
                                if (s.length === 0) {
                                    mem.setInt32(outPtr + 0, 0, true);
                                    mem.setInt32(outPtr + 4, 0, true);
                                    return 0;
                                }
                                setTextFont(state);
                                // Keep measurement consistent with the raster clamp to avoid caret/layout
                                // drifting beyond what the texture can show.
                                const m = textCtx.measureText(s);
                                const advancePx = Math.max(0, Math.ceil(m.width || 0));
                                const w = Math.min(2048, advancePx) * 64;
                                const h = state.metrics.lineSkip * 64;
                                mem.setInt32(outPtr + 0, w, true);
                                mem.setInt32(outPtr + 4, h, true);
                                return 0;
                            },
                            // Raster a whole UTF-8 run into backend WASM memory in a single call.
                            // JS measures, calls Module._backend_malloc, draws, and stores the backend ptr
                            // in outBitmapPtr[16]. Go reads bitmap dims + ptr, uploads, then calls backend_free.
                            backend_text_raster_alloc_utf8_rgba8_backend: (_e, font, textPtr, textLen, outBitmapPtr) => {
                                const state = textFonts.get(font);
                                if (!state || outBitmapPtr === 0) return -1;
                                let pixPtr = 0;
                                try {
                                    const mem = gameMem();
                                    const s = (textLen > 0 ? utf8FromGame(textPtr, textLen) : '').normalize('NFC');
                                    if (s.length === 0) {
                                        mem.setInt32(outBitmapPtr + 0, 0, true);
                                        mem.setInt32(outBitmapPtr + 4, 0, true);
                                        mem.setInt32(outBitmapPtr + 8, 0, true);
                                        mem.setInt32(outBitmapPtr + 12, 0, true);
                                        mem.setUint32(outBitmapPtr + 16, 0, true);
                                        return 0;
                                    }
                                    const layout = measureRunLayout(state, s);
                                    mem.setInt32(outBitmapPtr + 0, layout.width, true);
                                    mem.setInt32(outBitmapPtr + 4, layout.height, true);
                                    mem.setInt32(outBitmapPtr + 8, layout.ascent, true);
                                    mem.setInt32(outBitmapPtr + 12, layout.stride, true);
                                    if (layout.width <= 0 || layout.height <= 0) {
                                        mem.setUint32(outBitmapPtr + 16, 0, true);
                                        return 0;
                                    }
                                    const numBytes = layout.width * layout.height * 4;
                                    pixPtr = Module._backend_malloc(numBytes);
                                    if (!pixPtr) {
                                        mem.setUint32(outBitmapPtr + 16, 0, true);
                                        return -1;
                                    }
                                    textCanvas.width = layout.width;
                                    textCanvas.height = layout.height;
                                    setTextFont(state);
                                    textCtx.clearRect(0, 0, layout.width, layout.height);
                                    textCtx.fillText(s, layout.left, layout.ascent);
                                    const imgData = textCtx.getImageData(0, 0, layout.width, layout.height);
                                    new Uint8Array(backendMemory.buffer, pixPtr, numBytes).set(imgData.data);
                                    mem.setUint32(outBitmapPtr + 16, pixPtr, true);
                                    return 0;
                                } catch (err) {
                                    if (pixPtr) Module._backend_free(pixPtr);
                                    console.warn('backend_text_raster_alloc_utf8_rgba8_backend failed', { font, err });
                                    return -1;
                                }
                            },
                            backend_text_input_begin: (x, y, w, h, utf8Ptr, utf8Len, caretBytes) => {
                                const el = ensureTextInputEl();
                                // Coordinates are in CSS logical pixels (high_dpi not set in sokol_main).
                                el.style.left = x + 'px';
                                el.style.top = y + 'px';
                                el.style.width = w + 'px';
                                el.style.height = h + 'px';
                                const val = utf8Len > 0 ? utf8FromGame(utf8Ptr, utf8Len) : '';
                                el.value = val;
                                // Convert UTF-8 caret byte offset to UTF-16 code-unit offset.
                                let caretUnits = 0;
                                if (caretBytes > 0 && val.length > 0) {
                                    let bytes = 0, i = 0;
                                    while (i < val.length && bytes < caretBytes) {
                                        const cp = val.codePointAt(i);
                                        const cpBytes = cp < 0x80 ? 1 : cp < 0x800 ? 2 : cp < 0x10000 ? 3 : 4;
                                        if (bytes + cpBytes > caretBytes) break;
                                        bytes += cpBytes;
                                        i += cp > 0xFFFF ? 2 : 1;
                                    }
                                    caretUnits = i;
                                }
                                try { el.setSelectionRange(caretUnits, caretUnits); } catch (_) {}
                                if (document.activeElement !== el) el.focus();
                            },
                            backend_text_input_end: () => {
                                if (textInputEl && document.activeElement === textInputEl) {
                                    textInputEl.blur();
                                }
                            },
                            backend_text_input_poll: (outPtr, cap, caretPtr) => {
                                const el = textInputEl;
                                const mem = gameMem();
                                if (!el) {
                                    if (caretPtr) mem.setInt32(caretPtr, 0, true);
                                    return 0;
                                }
                                const val = el.value || '';
                                const bytes = val.length > 0 ? utf8Enc.encode(val) : new Uint8Array(0);
                                const sel = el.selectionStart || 0;
                                const caretBytes = sel > 0 ? utf8Enc.encode(val.substring(0, sel)).length : 0;
                                if (caretPtr) mem.setInt32(caretPtr, caretBytes, true);
                                if (outPtr && cap > 0 && bytes.length > 0) {
                                    const n = Math.min(cap, bytes.length);
                                    new Uint8Array(gameExports.memory.buffer, outPtr, n).set(bytes.subarray(0, n));
                                }
                                return bytes.length;
                            },
                            bulk_copy: (dst, src, len) => {
                                new Uint8Array(backendMemory.buffer, dst, len)
                                    .set(new Uint8Array(gameExports.memory.buffer, src, len));
                            },
                            bulk_copy_back: (dst, src, len) => {
                                new Uint8Array(gameExports.memory.buffer, dst, len)
                                    .set(new Uint8Array(backendMemory.buffer, src, len));
                            },
                        };
                        for (const key in Module) {
                            if (key.startsWith('_backend_'))
                                env[key.substring(1)] = Module[key];
                        }

                        const instance = new WebAssembly.Instance(mod, {
                            env,
                            wasi_snapshot_preview1: wasiPolyfill(),
                        });
                        gameExports = instance.exports;
                        if (gameExports._initialize) gameExports._initialize();
                        Module._gameExports = gameExports;
                        Module.removeRunDependency('game-wasm');
                    })
                    .catch(err => console.error('Failed to load game.wasm:', err));
            }],
        };
    </script>
    <script async src="triggle.js"></script>
</body>
</html>
